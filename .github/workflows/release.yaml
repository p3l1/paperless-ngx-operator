name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/p3l1/paperless-ngx-operator
  CHART_REGISTRY: oci://ghcr.io/p3l1/charts

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list
        id: manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd /tmp/digests
          docker buildx imagetools create \
            -t "${IMAGE}:${version}" -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "${IMAGE}:${version}" --format '{{.Manifest.Digest}}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${{ steps.manifest.outputs.digest }}"
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: operator.sbom.spdx.json
      - name: Attest the SBOM
        run: |
          cosign attest --yes --type spdxjson \
            --predicate operator.sbom.spdx.json \
            "${IMAGE}@${{ steps.manifest.outputs.digest }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - uses: softprops/action-gh-release@v2
        with:
          files: operator.sbom.spdx.json

  chart:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: sigstore/cosign-installer@v3
      - name: Package and push
        id: push
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm registry login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          helm package charts/paperless-ngx-operator --version "$version" --app-version "$version"
          helm push "paperless-ngx-operator-${version}.tgz" "${CHART_REGISTRY}" 2>&1 | tee push.log
          digest=$(awk '/Digest:/ {print $2}' push.log)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Sign the chart
        run: |
          cosign sign --yes "ghcr.io/p3l1/charts/paperless-ngx-operator@${{ steps.push.outputs.digest }}"
