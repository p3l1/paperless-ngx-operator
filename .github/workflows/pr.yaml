name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

# Without this, a bare "run:" step gets "bash -e {0}" — no pipefail, so a
# failure earlier in a pipe (e.g. inside a process substitution) is swallowed.
defaults:
  run:
    shell: bash

jobs:
  commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          pattern='^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\([a-z0-9._-]+\))?!?: .{1,72}$'
          failed=0
          while read -r line; do
            case "$line" in "Merge "*|"Revert "*) continue ;; esac
            if ! printf '%s' "$line" | grep -Eq "$pattern"; then
              echo "::error::not a Conventional Commit: $line"
              failed=1
            fi
          done < <(git log --format=%s "$base..$head")
          exit $failed
      - name: Check pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\([a-z0-9._-]+\))?!?: .{1,72}$'
          printf '%s' "$TITLE" | grep -Eq "$pattern" \
            || { echo "::error::PR title is not a Conventional Commit: $TITLE"; exit 1; }

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: extractions/setup-just@v2
      - uses: azure/setup-helm@v4
      - name: Install chart tooling
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - run: just check

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: extractions/setup-just@v2
      - run: just verify

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: extractions/setup-just@v2
      - run: just test

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: extractions/setup-just@v2
      - uses: azure/setup-helm@v4
      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash
      - run: just e2e
      - name: Dump operator logs on failure
        if: failure()
        run: |
          kubectl --context k3d-paperless-operator -n paperless-operator-system \
            logs -l app.kubernetes.io/name=paperless-ngx-operator --tail=200 || true
          kubectl --context k3d-paperless-operator -n paperless-operator-system \
            describe pods || true
