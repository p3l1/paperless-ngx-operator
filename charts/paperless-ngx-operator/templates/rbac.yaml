{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "paperless-ngx-operator.fullname" . }}
  labels:
    {{- include "paperless-ngx-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "paperless-ngx-operator.fullname" . }}
  labels:
    {{- include "paperless-ngx-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "paperless-ngx-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "paperless-ngx-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
